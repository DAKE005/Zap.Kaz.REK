  <script>
  const IMG_WIDTH = 7021;
  const IMG_HEIGHT = 4967;
  const wrapper = document.getElementById('scale-wrapper');

  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let dragMoved = false;
  let startX, startY;


  
  function applyTransform() {
    wrapper.style.transform = 'translate(' + translateX + 'px,' + translateY + 'px) scale(' + scale + ')';
  }

  
function goToCoords(x, y, targetScale) {
  translateX = window.innerWidth / 2 - x * targetScale;
  translateY = window.innerHeight / 2 - y * targetScale;
  scale = targetScale;
  applyTransform();
}

function goToRegion(id) {
  const target = document.getElementById(id);
  if (!target) return;
  const x = parseInt(target.style.left);
  const y = parseInt(target.style.top);
  const initialScale = Math.min(window.innerWidth / IMG_WIDTH, window.innerHeight / IMG_HEIGHT);
  goToCoords(x, y, initialScale * 3);
}

const substations = [
  { name: "Сайхин", left: 589, top: 3742 },
  { name: "Урда", left: 1100, top: 3796 },
  { name: "Сайхин_110", left: 494, top: 4442 },
  { name: "Бисен", left: 1282, top: 3532 },
  { name: "Темира_Масина", left: 1977, top: 3711 },
  { name: "Саралжын", left: 2282, top: 3345 },
  { name: "Искра", left: 2396, top: 3591 },
  { name: "Ак-Оба", left: 1105, top: 2957 },
  { name: "Жаскайрат", left: 1315, top: 3137 },
  { name: "Жанибек", left: 678, top: 2995 },
  { name: "Коминтерн", left: 892, top: 2758 },
  { name: "Насосная", left: 846, top: 2546 },
];

function searchSubstation() {
  document.getElementById('ps-search').blur();
  setTimeout(() => {
    const query = document.getElementById('ps-search').value.trim().toLowerCase();
    const statusEl = document.getElementById('search-status');
    if (!query) { statusEl.textContent = ''; return; }
    const found = substations.find(ps => ps.name.toLowerCase().includes(query));
    if (found) {
      const initialScale = Math.min(window.innerWidth / IMG_WIDTH, window.innerHeight / IMG_HEIGHT);
      goToCoords(found.left, found.top, initialScale * 3);
      statusEl.textContent = '';
      saveRecent(found.name);
    } else {
      statusEl.textContent = 'Не найдено: ' + query;
    }
  }, 150);
}

function saveRecent(name) {
  let recent = JSON.parse(localStorage.getItem('recentPS') || '[]');
  recent = recent.filter(n => n !== name);
  recent.unshift(name);
  recent = recent.slice(0, 5);
  localStorage.setItem('recentPS', JSON.stringify(recent));
  renderRecent();
}

function renderRecent() {
  const recent = JSON.parse(localStorage.getItem('recentPS') || '[]');
  const box = document.getElementById('recent-list');
  if (!box) return;
  box.innerHTML = recent.map(name => {
    const ps = substations.find(p => p.name === name);
    if (!ps) return '';
    const s = Math.min(window.innerWidth / IMG_WIDTH, window.innerHeight / IMG_HEIGHT) * 3;
    return '<div onclick="goToCoords(' + ps.left + ',' + ps.top + ',' + s + ')" style="padding:6px 10px; cursor:pointer; font-size:14px; border-bottom:1px solid #eee;">' + name + '</div>';
  }).join('');
}

  function fitToScreen() {
    const scaleX = window.innerWidth / IMG_WIDTH;
    const scaleY = window.innerHeight / IMG_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    translateX = (window.innerWidth - IMG_WIDTH * scale) / 2;
    translateY = (window.innerHeight - IMG_HEIGHT * scale) / 2;
    applyTransform();
  }

  // Зум колёсиком мыши
  document.body.addEventListener('wheel', function(e) {
    e.preventDefault();
    const zoomIntensity = 0.1;
    const direction = e.deltaY < 0 ? 1 : -1;
    const newScale = Math.min(Math.max(scale * (1 + direction * zoomIntensity), 0.1), 5);

    const rect = wrapper.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    translateX -= (mouseX / scale) * (newScale - scale);
    translateY -= (mouseY / scale) * (newScale - scale);

    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Перетаскивание мышкой (слушаем на window, чтобы не "залипало")

 document.body.addEventListener('mousedown', function(e) {
  if (e.target.closest('input, button, a')) return;
  e.preventDefault();
  isDragging = true;
  dragMoved = false;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  document.body.style.cursor = 'grabbing';
});

  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    dragMoved = true;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    applyTransform();
  });

  function stopDragging() {
    isDragging = false;
    document.body.style.cursor = 'grab';
  }
  window.addEventListener('mouseup', stopDragging);
  window.addEventListener('blur', stopDragging);

  // Если это был просто клик (без реального сдвига) — не мешаем ссылке сработать

 document.body.addEventListener('click', function(e) {
  if (e.target.closest('input, button, a')) return;
  if (dragMoved) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

  // Перетаскивание пальцем (планшет/телефон)
  let touchStartX, touchStartY;
 document.body.addEventListener('touchstart', function(e) {
  if (e.target.closest('input, button, a')) return;
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX - translateX;
    touchStartY = e.touches[0].clientY - translateY;
  }
});
  document.body.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1) {
      e.preventDefault();
      translateX = e.touches[0].clientX - touchStartX;
      translateY = e.touches[0].clientY - touchStartY;
      applyTransform();
    }
  }, { passive: false });

  window.addEventListener('load', function() { fitToScreen(); renderRecent(); });
  window.addEventListener('resize', fitToScreen);
  document.body.style.cursor = 'grab';
  window.addEventListener('pageshow', function(e) {
  fitToScreen();
});
</script>
