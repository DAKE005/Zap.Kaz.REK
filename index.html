  function searchSubstation() {
    document.getElementById('ps-search').blur();
    setTimeout(() => {
      const query = document.getElementById('ps-search').value.trim().toLowerCase();
      const statusEl = document.getElementById('search-status');
      if (!query) { statusEl.textContent = ''; return; }
      const found = substations.find(ps => ps.name.toLowerCase().includes(query));
      if (found) {
        const initialScale = Math.min(window.innerWidth / IMG_WIDTH, window.innerHeight / IMG_HEIGHT);
        goToCoords(found.left, found.top, initialScale * 3);
        statusEl.textContent = '';
        saveRecent(found.name);
      } else {
        statusEl.textContent = 'Не найдено: ' + query;
      }
    }, 150);
  }

  function saveRecent(name) {
    let recent = JSON.parse(localStorage.getItem('recentPS') || '[]');
    recent = recent.filter(n => n !== name);
    recent.unshift(name);
    recent = recent.slice(0, 5);
    localStorage.setItem('recentPS', JSON.stringify(recent));
    renderRecent();
  }

  function renderRecent() {
    const recent = JSON.parse(localStorage.getItem('recentPS') || '[]');
    const box = document.getElementById('recent-list');
    if (!box) return;
    box.innerHTML = recent.map(name => {
      const ps = substations.find(p => p.name === name);
      if (!ps) return '';
      const s = Math.min(window.innerWidth / IMG_WIDTH, window.innerHeight / IMG_HEIGHT) * 3;
      return '<div onclick="goToCoords(' + ps.left + ',' + ps.top + ',' + s + ')" style="padding:6px 10px; cursor:pointer; font-size:14px; border-bottom:1px solid #eee;">' + name + '</div>';
    }).join('');
  }

  function fitToScreen() {
    const scaleX = window.innerWidth / IMG_WIDTH;
    const scaleY = window.innerHeight / IMG_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    translateX = (window.innerWidth - IMG_WIDTH * scale) / 2;
    translateY = (window.innerHeight - IMG_HEIGHT * scale) / 2;
    applyTransform();
  }

  // Зум колёсиком мыши
  document.body.addEventListener('wheel', function(e) {
    e.preventDefault();
    const zoomIntensity = 0.1;
    const direction = e.deltaY < 0 ? 1 : -1;
    const newScale = Math.min(Math.max(scale * (1 + direction * zoomIntensity), 0.1), 5);

    const rect = wrapper.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    translateX -= (mouseX / scale) * (newScale - scale);
    translateY -= (mouseY / scale) * (newScale - scale);

    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Универсальная обработка мышь + палец через Pointer Events
  const activePointers = new Map();
  let pinchStartDist = null;
  let pinchStartScale = 1;
  let pinchStartMidX = 0;
  let pinchStartMidY = 0;

  function getPointersArray() {
    return Array.from(activePointers.values());
  }

  function getDist(p1, p2) {
    const dx = p1.x - p2.x;
    const dy = p1.y - p2.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  document.body.addEventListener('pointerdown', function(e) {
    if (e.target.closest('input, button, a')) return;
    e.preventDefault();
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragMoved = false;

    const pts = getPointersArray();
    if (pts.length === 1) {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      document.body.style.cursor = 'grabbing';
    } else if (pts.length === 2) {
      isDragging = false;
      pinchStartDist = getDist(pts[0], pts[1]);
      pinchStartScale = scale;
      pinchStartMidX = (pts[0].x + pts[1].x) / 2;
      pinchStartMidY = (pts[0].y + pts[1].y) / 2;
    }
  });

  document.body.addEventListener('pointermove', function(e) {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = getPointersArray();

    if (pts.length === 1 && isDragging) {
      e.preventDefault();
      dragMoved = true;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      applyTransform();
    } else if (pts.length === 2 && pinchStartDist) {
      e.preventDefault();
      const newDist = getDist(pts[0], pts[1]);
      const newScale = Math.min(Math.max(pinchStartScale * (newDist / pinchStartDist), 0.1), 5);

      const rect = wrapper.getBoundingClientRect();
      const mouseX = pinchStartMidX - rect.left;
      const mouseY = pinchStartMidY - rect.top;

      translateX -= (mouseX / scale) * (newScale - scale);
      translateY -= (mouseY / scale) * (newScale - scale);

      scale = newScale;
      applyTransform();
    }
  });

  function endPointer(e) {
    activePointers.delete(e.pointerId);
    const pts = getPointersArray();
    if (pts.length === 0) {
      isDragging = false;
      pinchStartDist = null;
      document.body.style.cursor = 'grab';
    } else if (pts.length === 1) {
      pinchStartDist = null;
      isDragging = true;
      startX = pts[0].x - translateX;
      startY = pts[0].y - translateY;
    }
  }
  document.body.addEventListener('pointerup', endPointer);
  document.body.addEventListener('pointercancel', endPointer);

  document.body.addEventListener('click', function(e) {
    if (e.target.closest('input, button, a')) return;
    if (dragMoved) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  window.addEventListener('load', function() { fitToScreen(); renderRecent(); });
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    if (Math.abs(window.innerWidth - lastWidth) > 50) {
      lastWidth = window.innerWidth;
      fitToScreen();
    }
  });
  document.body.style.cursor = 'grab';
  window.addEventListener('pageshow', function(e) {
    fitToScreen();
  });
